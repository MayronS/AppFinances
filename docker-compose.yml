# ==================================================================
# App Finanças - Backend + Banco (Docker Compose)
# ==================================================================
# Observação: este compose sobe o backend. O banco pode ser:
#   a) PostgreSQL Neon (nuvem) - defina DB_URL/DB_USERNAME/DB_PASSWORD no .env
#   b) PostgreSQL local - descomente o serviço 'db' abaixo
# ==================================================================

services:
  backend:
    build: .
    container_name: appfinances-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${DB_URL:-jdbc:postgresql://localhost:5432/appfinances}
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
    restart: unless-stopped

  # Descomente esta seção se quiser rodar o PostgreSQL localmente
  # em vez de usar o Neon. Se for usar o Neon, remova este serviço
  # e defina DB_URL para a string de conexão do Neon.
  #
  # db:
  #   image: postgres:16-alpine
  #   container_name: appfinances-db
  #   environment:
  #     POSTGRES_DB: appfinances
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - appfinances_db_data:/var/lib/postgresql/data
  #   restart: unless-stopped

