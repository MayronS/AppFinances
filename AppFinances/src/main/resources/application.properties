# ==================================================================
# App Finanças - Backend Spring Boot
# Configure as variáveis de ambiente ou edite os valores abaixo.
# ==================================================================

server.port=8080

# --- Banco de dados PostgreSQL (Neon ou local) ---
# Use variáveis de ambiente para dados sensíveis em produção:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/appfinances}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Jackson (JSON) ---
spring.jackson.property-naming-strategy=SNAKE_CASE

# --- Permitir requisições do Android (CORS já está nos controllers) ---
